# 宝塔面板：站点配置片段
#
# 用法：宝塔面板 → 网站 → 你的站点 → 设置 → 配置文件，
#      把下面内容粘到 server { } 里面（不要整个替换 server 块，
#      否则会丢掉宝塔自动生成的 SSL / 日志 / 伪静态等配置）。
#
# 站点根目录（网站目录）请指向前端产物：
#   /opt/hyperfstu/MineAdmin-Vue/dist
# 并把这个站点的 PHP 版本设为「纯静态」（静态站 + 反代，不需要 php-fpm）。
#
# ⚠️ 下面所有 /opt/hyperfstu 都要换成你自己的实际目录。
#    宝塔默认站点目录是 /www/wwwroot/<域名>，项目放在那里就写
#    /www/wwwroot/hyperfstu/MineAdmin-Vue/dist 之类。
#
# 注意：如果你的 server 块里已经有 location / {...}，
#      不要重复添加，只改它的 root 或加 try_files 即可（hash 路由其实不需要 fallback）。
#
# 需要 WebSocket 时（当前 MineAdmin 前端不依赖，可以先不管）：
#   map 指令只能写在 http{} 里，不能写进 server{}。
#   宝塔 → 软件商店 → Nginx → 配置修改，在 http { } 内加：
#       map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
#   然后在下面的 location ^~ /hyperfproapi/ 里加回这两行：
#       proxy_set_header Upgrade    $http_upgrade;
#       proxy_set_header Connection $connection_upgrade;

    # 请求体上限，和 PHP 的 upload_max_filesize / post_max_size 对齐
    client_max_body_size 100m;

    # ------------------------------------------------------------
    # 压缩：构建时没有生成 .gz/.br（见 docs/12），交给 Nginx 实时压
    # ------------------------------------------------------------
    # gzip 可以写在 server{} 里；gzip_static 需要编译了模块，这里不用。
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/javascript application/json
                      application/xml application/rss+xml
                      image/svg+xml;

    # ------------------------------------------------------------
    # 后端 API：/hyperfproapi/xxx -> http://127.0.0.1:9501/xxx
    # ------------------------------------------------------------
    # 一定要带尾斜杠：/hyperfproapi/admin/x -> /admin/x
    # 如果写成 http://127.0.0.1:9501（无斜杠），后端会收到 /hyperfproapi/admin/x，全部 404。
    #
    # 用 ^~ 是为了让这个前缀优先于宝塔自带的
    #   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    # 否则 /hyperfproapi/xxx.png 这种路径会被静态规则抢走。
    location ^~ /hyperfproapi/ {
        proxy_pass http://127.0.0.1:9501/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Prefix /hyperfproapi;
        proxy_set_header X-Original-URI    $request_uri;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_redirect off;
        proxy_hide_header X-Powered-By;
    }

    location = /hyperfproapi {
        return 301 /hyperfproapi/;
    }

    # ------------------------------------------------------------
    # 上传的附件：Nginx 直接读磁盘，不经过容器
    # ------------------------------------------------------------
    # 宝塔的 nginx worker 以 www 用户运行，所以要保证目录可读：
    #   chmod -R o+rX /opt/hyperfstu/MineAdmin/storage/uploads
    location ^~ /uploads/ {
        alias /opt/hyperfstu/MineAdmin/storage/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    # ------------------------------------------------------------
    # 前端静态资源
    # ------------------------------------------------------------
    # 文件名带 hash，可以长期缓存
    location ^~ /static/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # index.html 不能缓存，否则发布后还加载旧的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /favicon.ico {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # dist/font 里的字体文件同样是长期不变的
    location ^~ /font/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # ------------------------------------------------------------
    # 排障用：只经过宝塔 Nginx，看这一层拿到了什么变量
    # GET /__echo?x=1
    # 上线前建议删掉
    # ------------------------------------------------------------
    location = /__echo {
        default_type text/plain;
        return 200 "remote_addr=$remote_addr\nhost=$host\nhttp_host=$http_host\nserver_port=$server_port\nscheme=$scheme\nrequest_method=$request_method\nrequest_uri=$request_uri\nuri=$uri\nargs=$args\nrequest_id=$request_id\nuser_agent=$http_user_agent\nx_custom=$http_x_custom\nx_real_ip=$http_x_real_ip\nx_forwarded_for=$http_x_forwarded_for\n";
    }
