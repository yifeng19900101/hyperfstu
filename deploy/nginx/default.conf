# MineAdmin 前端静态站 + 后端反向代理
# 前端构建时 VITE_OPEN_PROXY=true，axios 的 baseURL 是 /prod，
# 所以这里把 /prod/ 前缀去掉后转发给 Swoole（app:9501）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 附件上传大小（按需调整）
    client_max_body_size 100m;

    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---- 后端 API：/prod/admin/xxx -> http://app:9501/admin/xxx ----
    location /prod/ {
        proxy_pass http://app:9501/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大文件上传 / 导出可能比较慢
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # ---- 上传的附件由 Nginx 直接读磁盘，不经过 PHP ----
    location /uploads/ {
        alias /srv/uploads/;
        access_log off;
        expires 7d;
    }

    # ---- 带 hash 的静态资源可以长期缓存 ----
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发布后刷新就能拿到新的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- 前端 SPA（当前是 hash 路由，保留 fallback 以后切 history 也不用改）----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
