# MineAdmin：Nginx 反向代理 + 前端静态站
#
# 链路：
#   浏览器 --:80--> nginx --/hyperfproapi/*--> app:9501 (Swoole)
#                    └--/*--> MineAdmin-Vue/dist (Vue 构建产物，已提交进仓库)
#
# 重点：nginx 是唯一入口，后端看到的 remote_addr 是 nginx 容器 IP，
#       真实客户端 IP 必须靠下面这几个 header 传进去。

# WebSocket 升级：普通请求把 Connection 清空（保持长连接），
# 带 Upgrade 头的请求才改成 upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 上传大小上限，和 PHP upload_max_filesize / post_max_size 保持一致
    client_max_body_size 100m;
    client_body_timeout 300s;

    # ---- 压缩 ----
    gzip on;
    gzip_static on;              # 命中构建时生成的 .gz（Vite 已生成）
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ============================================================
    # 0. 如果 nginx 前面还有一层代理（CDN / SLB / 负载均衡）
    # ============================================================
    # 此时 $remote_addr 是上一层代理的 IP，需要 real_ip 模块把真实 IP 还原。
    # 只信任你自己的代理网段，千万不要写 0.0.0.0/0（否则客户端可伪造 IP）。
    #
    # set_real_ip_from  10.0.0.0/8;
    # set_real_ip_from  172.16.0.0/12;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;
    #
    # 打开后，下面的 $remote_addr / $proxy_add_x_forwarded_for 都会自动变正确。

    # ============================================================
    # 1. 后端 API：/hyperfproapi/xxx -> http://app:9501/xxx
    # ============================================================
    # proxy_pass 末尾那个 "/" 决定是否剥掉 location 前缀：
    #   proxy_pass http://app:9501;    （无斜杠）  /hyperfproapi/admin/x -> /hyperfproapi/admin/x
    #   proxy_pass http://app:9501/;   （有斜杠）  /hyperfproapi/admin/x -> /admin/x
    # 前端 .env.production 里 VITE_OPEN_PROXY=true，axios baseURL 就是 /hyperfproapi，
    # 所以这里必须带斜杠，把 /hyperfproapi 去掉再给 Swoole。
    location /hyperfproapi/ {
        proxy_pass http://app:9501/;
        proxy_http_version 1.1;

        # ---- 客户端标识 ----
        # Host：保持浏览器看到的域名，后端生成的绝对 URL 才正确
        proxy_set_header Host              $host;
        # X-Real-IP：直接给单个真实 IP，最省事的取值方式
        proxy_set_header X-Real-IP         $remote_addr;
        # X-Forwarded-For：追加式。nginx 会变成 "客户端IP, 上一层代理IP,..."
        # 用 $proxy_add_x_forwarded_for 而不是 $http_x_forwarded_for，
        # 后者会把客户端传来的值原样透传，可被伪造。
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 协议（http/https）：后端拼链接、判断是否 secure 时用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # 被剥掉的前缀，方便后端反向生成带 /hyperfproapi 的地址
        proxy_set_header X-Forwarded-Prefix /hyperfproapi;
        # 保留原始请求行（含 query string），排障时用
        proxy_set_header X-Original-URI    $request_uri;
        # 每个请求的唯一 ID，方便串起 nginx 访问日志和后端日志
        proxy_set_header X-Request-Id      $request_id;

        # ---- WebSocket / SSE 升级 ----
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ---- 超时：导出 Excel、大文件上传可能很久 ----
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 请求体不落地，直接流式转发（大文件上传省内存）
        proxy_request_buffering off;
        # 响应不缓冲，SSE / 流式下载能实时吐
        proxy_buffering off;

        # 不让 nginx 改写后端 Location/Set-Cookie 里的地址
        proxy_redirect off;

        # 后端真实 IP 只通过 header 传，不向客户端暴露
        proxy_hide_header X-Powered-By;
    }

    # 少写一个斜杠也能用
    location = /hyperfproapi {
        return 301 /hyperfproapi/;
    }

    # ============================================================
    # 2. 纯 nginx 回显：验证 nginx 这一层拿到了什么
    #    GET /__echo?x=1  ->  text/plain
    # ============================================================
    location = /__echo {
        default_type text/plain;
        return 200 "remote_addr=$remote_addr\nhost=$host\nhttp_host=$http_host\nserver_port=$server_port\nscheme=$scheme\nrequest_method=$request_method\nrequest_uri=$request_uri\nuri=$uri\nargs=$args\nrequest_id=$request_id\nuser_agent=$http_user_agent\nx_custom=$http_x_custom\nx_real_ip=$http_x_real_ip\nx_forwarded_for=$http_x_forwarded_for\n";
    }

    # ============================================================
    # 3. 上传的附件：nginx 直接读磁盘，不经过 PHP
    # ============================================================
    # 注意：alias 不能和 try_files 一起用。
    # alias 会把 location 前缀替换成磁盘路径，try_files 再把完整 $uri 拼上去，
    # 结果变成 /srv/uploads//uploads/x.png，必然 404。
    location /uploads/ {
        alias /srv/uploads/;
        access_log off;
        # 只用 add_header 控制缓存，避免和 expires 产生两个 Cache-Control
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
    }

    # ============================================================
    # 4. 前端静态资源
    # ============================================================
    # 带 hash 的文件可以长期缓存
    # 注意：location 里一写 add_header，server 级的 add_header 就全部失效
    # （nginx 的 add_header 不做继承合并），所以这里要重复写安全头。
    location /static/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # index.html 绝不能缓存，否则发布后还加载旧的 hash 资源
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # 前端 SPA：现在是 hash 路由，保留 fallback 以后切 history 也不用改
    location / {
        try_files $uri $uri/ /index.html;
    }
}
