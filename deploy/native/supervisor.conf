; 宝塔面板 → 软件商店 → 「进程守护管理器」(Supervisor) 添加进程时参考这份配置。
; 实际添加时按界面填即可，界面会写到 /www/server/panel/plugin/supervisor/ 下。
;
; 关键点：
;   1. 命令不要加 -d / &，Hyperf 3.2 的 start 本来就跑在前台，由 Supervisor 托管
;   2. numprocs 必须是 1（Swoole 自己管理 worker 进程）
;   3. 用 www 用户，和 runtime/ storage/ 的属主保持一致
;   4. stopasgroup / killasgroup 打开，避免 Swoole worker 变孤儿进程

[program:mineadmin]
directory=/opt/hyperfstu/MineAdmin
command=/www/server/php/83/bin/php /opt/hyperfstu/MineAdmin/bin/hyperf.php start
user=www
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/opt/hyperfstu/MineAdmin/runtime/logs/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
